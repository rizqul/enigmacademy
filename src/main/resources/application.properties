spring.application.name=enigmaCademy

# database configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# hibernate configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.hibernate.ddl-auto=update

# JWT configuration
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-ms=${JWT_EXPIRATION}

# Logging Configuration
logging.level.root=INFO
logging.level.com.enigmacamp.enigmaCademy=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Spring Security Log Level
logging.level.org.springframework.security=DEBUG

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,https://mydomain.com